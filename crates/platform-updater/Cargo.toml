[package]
name = "ai-image-factory-updater"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "updated"
path = "src/main.rs"
test = false
bench = false

[dependencies]
hex = "0.4.3"
fs2 = "0.4.3"
libc = "0.2.183"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "uuid", "json", "macros"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.4", features = ["v4", "serde"] }
