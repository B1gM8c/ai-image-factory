[package]
name = "image-cli-runtime"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
libc = "0.2.182"
rustix = { version = "1.1.4", features = ["fs"] }
sha2 = "0.11.0"
thiserror = "2.0.17"
tokio = { version = "1.52.0", features = ["fs", "io-util", "process", "rt", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.52.0", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
