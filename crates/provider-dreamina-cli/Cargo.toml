[package]
name = "image-provider-dreamina-cli"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[dependencies]
image-cli-runtime = { path = "../cli-runtime" }
image-provider-contracts = { path = "../provider-contracts" }
image-provider-sdk = { path = "../provider-sdk" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"

[dev-dependencies]
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.52.0", features = ["macros", "rt-multi-thread"] }
