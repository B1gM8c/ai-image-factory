[package]
name = "factory-identity"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "0.5.3", features = ["std", "zeroize"] }
async-trait = "0.1.89"
base64 = "0.22.1"
getrandom = "0.4.3"
hmac = "0.13.0"
jsonwebtoken = { version = "10.4.0", default-features = true, features = ["rust_crypto"] }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt", "sync"] }
uuid = { version = "1.23.4", features = ["v4", "serde"] }
