name: Immutable Linux release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ai_image_factory_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_image_factory_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_image_factory_test
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Verify annotated signed release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF_PROTECTED:-false}" = true
          tag_object_type="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" \
              --jq '.object.type'
          )"
          test "$tag_object_type" = tag
          tag_object_sha="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" \
              --jq '.object.sha'
          )"
          test "$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" \
              --jq '.verification.verified'
          )" = true
          test "$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" \
              --jq '.object.type'
          )" = commit
          test "$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" \
              --jq '.object.sha'
          )" = "$RELEASE_COMMIT"

      - name: Install native build dependencies
        run: |
          if command -v shellcheck >/dev/null 2>&1 \
            && command -v pkg-config >/dev/null 2>&1 \
            && pkg-config --exists openssl; then
            shellcheck --version
            pkg-config --modversion openssl
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libssl-dev \
            pkg-config \
            shellcheck

      - name: Validate release scripts and systemd topology
        run: |
          set -Eeuo pipefail
          shellcheck \
            scripts/package-release.sh \
            scripts/fetch-grok-cli.sh \
            scripts/test-gateway-runtime-gate.sh \
            scripts/test-release-process-hooks.sh \
            deploy/hooks/* \
            deploy/install-release \
            deploy/upgrade-updater
          bash -n \
            scripts/package-release.sh \
            scripts/fetch-grok-cli.sh \
            scripts/test-gateway-runtime-gate.sh \
            scripts/test-release-process-hooks.sh \
            deploy/hooks/* \
            deploy/install-release \
            deploy/upgrade-updater

          scripts/test-gateway-runtime-gate.sh
          scripts/test-release-process-hooks.sh

          sudo install -d \
            /etc/ai-image-factory \
            /opt/ai-image-factory/current/bin \
            /opt/ai-image-factory/current/admin \
            /usr/libexec/ai-image-factory \
            /usr/libexec/ai-image-factory/hooks \
            /usr/share/doc/ai-image-factory \
            /var/lib/ai-image-factory/admin-runtime \
            /var/lib/ai-image-factory/artifacts \
            /var/lib/ai-image-factory/backups \
            /var/lib/ai-image-factory/updater
          id ai-image-factory >/dev/null 2>&1 \
            || sudo useradd --system --home /var/lib/ai-image-factory \
              --shell /usr/sbin/nologin ai-image-factory
          test -x /usr/bin/node \
            || sudo ln -s /usr/bin/true /usr/bin/node
          sudo install -m 0600 deploy/systemd/admin.env.example \
            /etc/ai-image-factory/admin.env
          sudo install -m 0600 deploy/systemd/app.env.example \
            /etc/ai-image-factory/app.env
          sudo install -m 0600 deploy/systemd/update-policy.env.example \
            /etc/ai-image-factory/update-policy.env
          sudo install -m 0600 deploy/systemd/updater.env.example \
            /etc/ai-image-factory/updater.env
          sudo install -m 0644 docs/operations/github-release-deployment.md \
            /usr/share/doc/ai-image-factory/github-release-deployment.md
          for binary in \
            executord \
            gpt-image-2-gateway \
            provider-pollerd \
            provider-submitd \
            reconcilerd \
            reducerd \
            webhookd \
            workerd; do
            sudo install -m 0755 /usr/bin/true \
              "/opt/ai-image-factory/current/bin/${binary}"
          done
          sudo install -m 0755 /usr/bin/true \
            /opt/ai-image-factory/current/bin/grok
          sudo install -m 0755 /usr/bin/true \
            /usr/libexec/ai-image-factory/updated
          sudo install -m 0755 deploy/hooks/fail-closed \
            /usr/libexec/ai-image-factory/hooks/fail-closed
          sudo touch /opt/ai-image-factory/current/admin/server.js
          systemd-analyze verify --recursive-errors=yes \
            deploy/systemd/*.service \
            deploy/systemd/*.target
          grep -Fq -- '--job-mode=ignore-requirements' \
            deploy/hooks/start-processes
          grep -Fq -- '--job-mode=ignore-dependencies' \
            deploy/hooks/start-processes
          grep -Fq 'START_MODE" == "gate"' \
            deploy/hooks/start-processes
          grep -Fq 'ai-image-factory-processes.target' \
            deploy/hooks/start-processes
          grep -Fq 'ai-image-factory.target' \
            deploy/hooks/start-processes
          ! grep -Fq 'EnvironmentFile=' \
            deploy/systemd/ai-image-factory-recovery-failed.service
          ! grep -Fq 'AIF_UPDATE_ADMISSION_CLOSE_HOOK' \
            deploy/hooks/fail-closed
          grep -Fq '"ops/hooks/fail-closed"' deploy/install-release
          grep -Fq '"ops/hooks/verify-gateway-runtime"' deploy/install-release
          grep -Fq \
            '"ops/systemd/ai-image-factory-updater-recover@.service"' \
            deploy/install-release
          test "$(grep -c "'activating_full'" \
            crates/platform-updater/src/lib.rs)" -ge 3

      - name: Select repository Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify Rust formatting
        run: cargo fmt --all -- --check

      - name: Test Rust workspace
        run: cargo test --locked --workspace --all-targets -- --test-threads=1

      - name: Install admin dependencies
        run: npm ci

      - name: Type-check admin console
        run: npm run typecheck:admin

  build-linux:
    name: Build ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install native build dependencies
        run: |
          if command -v pkg-config >/dev/null 2>&1 \
            && pkg-config --exists openssl; then
            pkg-config --modversion openssl
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libssl-dev pkg-config

      - name: Install target Rust standard library
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          rustup target add "$RELEASE_TARGET"
          rustc --version --verbose
          cargo --version

      - name: Build complete Rust process set
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          cargo build \
            --locked \
            --release \
            --target "$RELEASE_TARGET" \
            --package gpt-image-2-gateway \
            --bins
          cargo build \
            --locked \
            --release \
            --target "$RELEASE_TARGET" \
            --package ai-image-factory-updater \
            --bin updated

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build architecture-matched admin standalone
        run: |
          npm ci
          npm run build:admin

      - name: Fetch lock-verified official Grok CLI
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: scripts/fetch-grok-cli.sh "$RELEASE_TARGET" dist/grok-provider

      - name: Package deterministic release assets
        env:
          GROK_PROVIDER_BINARY: ${{ github.workspace }}/dist/grok-provider
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$RELEASE_COMMIT")"
          scripts/package-release.sh \
            "$RELEASE_VERSION" \
            "$RELEASE_TARGET" \
            "$RELEASE_COMMIT" \
            dist

      - name: Upload architecture assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.manifest.json
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  attest-and-release:
    name: Attest and publish immutable release
    needs: build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out tagged release tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Require immutable releases before publication
        env:
          GH_TOKEN: ${{ secrets.RELEASE_POLICY_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(
            gh api \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/immutable-releases" \
              --jq '.enabled'
          )" = true

      - name: Download all architecture assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify release assets before attestation
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          install -m 0755 deploy/install-release dist/install-release
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = 5
          test -x dist/install-release
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            prefix="dist/ai-image-factory-${RELEASE_VERSION}-${target}"
            manifest="${prefix}.manifest.json"
            bundle="${prefix}.tar.gz"
            test -s "$manifest"
            test -s "$bundle"
            jq --exit-status \
              --arg version "$RELEASE_VERSION" \
              --arg commit "$RELEASE_COMMIT" \
              --arg target "$target" \
              '
                .schema_version == 1
                and .updater_protocol_version == 1
                and .release_version == $version
                and .commit_sha == $commit
                and .target_triple == $target
                and .migration_version == .target_schema_version
                and .min_schema_version <= .target_schema_version
                and .rollback_mode == "backup_restore"
                and (.files | length > 0)
                and (
                  .files
                  | all(
                      if (
                        (.path | startswith("bin/"))
                        or (.path | startswith("ops/hooks/"))
                        or .path == "ops/install-release"
                        or .path == "ops/upgrade-updater"
                      )
                      then .mode == 493
                      else .mode == 420
                      end
                    )
                )
              ' \
              "$manifest" >/dev/null
            test "$(sha256sum "$bundle" | awk '{print $1}')" = \
              "$(jq --raw-output '.bundle_sha256' "$manifest")"
            test "$(stat --format='%s' "$bundle")" = \
              "$(jq --raw-output '.bundle_bytes' "$manifest")"
            tar -tzf "$bundle" >/dev/null

            install_root="/var/lib/ai-image-factory-ci-${target}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            libexec_root="/usr/libexec/ai-image-factory-ci-${target}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            sudo install -d -o root -g root -m 0755 "$install_root" "$libexec_root"
            protected_assets="${install_root}/bootstrap/${RELEASE_VERSION}"
            sudo install -d -m 0755 "$protected_assets"
            sudo install -m 0644 "$bundle" "$manifest" "$protected_assets/"
            sudo env \
              AIF_INSTALL_ROOT="$install_root" \
              AIF_LIBEXEC_ROOT="$libexec_root" \
              dist/install-release \
              "$RELEASE_VERSION" \
              "$target" \
              "${protected_assets}/$(basename "$bundle")" \
              "${protected_assets}/$(basename "$manifest")"
            sudo rm -rf -- "$install_root" "$libexec_root"
          done

      - name: Attest release assets
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: "${{ github.workspace }}/dist/*"

      - name: Create draft release and upload every asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          tag_object_sha="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" \
              --jq '.object.sha'
          )"
          test "$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" \
              --jq '.verification.verified'
          )" = true
          test "$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" \
              --jq '.object.sha'
          )" = "$RELEASE_COMMIT"
          gh release create "$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "$RELEASE_VERSION" \
            --notes "Immutable AI Image Factory Linux release for ${GITHUB_SHA}."
          gh release upload "$RELEASE_VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY"

      - name: Publish release after all uploads succeed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          verify_tag_commit() {
            local tag_object_sha
            tag_object_sha="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" \
                --jq '.object.sha'
            )"
            test "$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" \
                --jq '.verification.verified'
            )" = true
            test "$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" \
                --jq '.object.sha'
            )" = "$RELEASE_COMMIT"
          }
          verify_tag_commit
          gh release edit "$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
          for attempt in $(seq 1 12); do
            if test "$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_VERSION}" \
                --jq '.immutable'
            )" = true \
              && verify_tag_commit \
              && gh release verify "$RELEASE_VERSION" \
                --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            sleep 5
          done
          printf 'published release did not become verifiably immutable\n' >&2
          exit 1
